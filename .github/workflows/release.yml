# Builds Speck.app on a GitHub Mac and publishes it as a release.
# Usage: git tag v0.2 && git push origin v0.2
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - name: Zip
        run: ditto -c -k --keepParent build/Speck.app Speck.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Speck.zip --title "Speck ${GITHUB_REF_NAME#v}" --generate-notes
