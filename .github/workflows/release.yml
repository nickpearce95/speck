# Builds Speck.app on a GitHub Mac and publishes it as a release.
# Usage: Actions → Release → Run workflow (enter e.g. 0.2), or git tag v0.2 && git push origin v0.2
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.2)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: VERSION="${VERSION#v}" ./build.sh
      - name: Zip
        run: ditto -c -k --keepParent build/Speck.app Speck.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${VERSION#v}"
          gh release create "v$v" Speck.zip --target "$GITHUB_SHA" --title "Speck $v" --generate-notes
