# TEMPORARY: checks what Spotify's authorize page returns for a bad Client ID. Remove before merging.
name: Probe
on: pull_request
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          u='https://accounts.spotify.com/authorize?response_type=code&redirect_uri=http%3A%2F%2F127.0.0.1%3A8898%2Fcallback&code_challenge_method=S256&code_challenge=abc&scope=streaming&state=x'
          for id in 00000000000000000000000000000000; do
            echo "== client_id=$id"
            curl -sS -o body.html -w 'HTTP %{http_code} -> %{redirect_url}\n' "$u&client_id=$id"
            grep -oiE 'invalid (client|redirect uri)' body.html | sort -u || echo "(no INVALID text)"
          done
